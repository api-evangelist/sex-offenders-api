description: 'CrimeoMeter serves a live, anonymous, remote MCP endpoint from its own domain. IMPORTANT
  SCOPE NOTE: this is the Wix Site MCP that the Wix platform provisions for every site it hosts (crimeometer.com
  runs on Wix), not a CrimeoMeter-authored server for the Sex Offenders API. Its tools read the public
  website, the site''s business details and the Wix business-solution APIs installed on it. NONE of the
  nine tools calls api.crimeometer.com, and no tool exposes sex-offender records. An agent can reach CrimeoMeter
  over MCP today, but only to read the marketing site — the Sex Offenders API itself remains reachable
  solely over HTTPS + x-api-key.'
