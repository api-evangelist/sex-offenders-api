filtering:
  exact_vs_fuzzy: >-
    CrimeoMeter publishes paired parameters for exact matching — zipcode/exact_zipcode and
    alias/exact_alias — implying the unprefixed forms are fuzzy or prefix matches. The
    matching semantics are not stated in prose anywhere.
  date_window: last_updated_after / last_updated_before, published in the form "YYYY-MM-DD HH:MM:SS"
  geo: lat + lon + distance, distance published in the form "<number>mi"
  datetime_inconsistency: >-
    The Sex Offenders requests use space-separated "YYYY-MM-DD HH:MM:SS"; the Crime Data and
    911 Calls requests in the same collection use ISO-8601 "YYYY-MM-DDTHH:MM:SS.000Z". Two
    date formats coexist in one published collection.
