description: >-
  CrimeoMeter publishes no rate limits. THIS FILE REPLACES A SCAFFOLD: the prior version
  (method: generated, dated 2026-05-04) asserted 10 req/min and 1,000 req/month on a free
  tier, 100 req/min and 100,000 req/month on a professional tier, and a 1,000 req/min
  enterprise ceiling, together with X-RateLimit-* response headers. None of that is
  published by CrimeoMeter and none of it was observed on the wire. All of it is removed.
limit_count: 0
headers:
  observed: []
  documented: []
  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After header appeared on any live response.
    Responses carry only AWS API Gateway / CloudFront headers (x-amzn-requestid,
    x-amz-apigw-id, x-amz-cf-id, access-control-allow-origin).
responseCodes:
  throttled: unknown
  note: >-
    Not observable without a key. The edge answers every unauthenticated request with 403
    Forbidden, so the exhaustion status code cannot be established anonymously. AWS API
    Gateway usage plans conventionally return 429 with {"message":"Limit Exceeded"}, but
    CrimeoMeter does not document this and it is NOT asserted here.
limits: []
policies: []
