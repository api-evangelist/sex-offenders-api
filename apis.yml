description: The Sex Offenders API from CrimeoMeter (CityCop Corporation dba CrimeoMeter, San Francisco)
  returns registered sex offender records from US state registries, searchable by zip code, first/last
  name, alias, birthdate, a last-updated window, or a latitude/longitude radius. Records carry identity,
  physical description, charges, registry status (predator, absconder) and geocoded address, plus created/last-updated/last-synced
  timestamps that expose how fresh each record is against its source registry. Access is a private x-api-key
  issued by hand through the Contact Us form; there is no self-service signup. CrimeoMeter publishes no
  OpenAPI, but does publish a public Postman collection covering v5 of this API.
