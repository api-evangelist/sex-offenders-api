versioning:
  scheme: path-prefix
  pattern: https://api.crimeometer.com/v{n}/...
  current: v5
  observed_versions:
    - version: v2
      surface: Crime Data / Crime Stats / CSI operations in the published Postman collection
    - version: v3
      surface: 911 Calls operations in the published Postman collection; also the version shown in the Sex Offenders API product-page example
    - version: v5
      surface: Sex Offenders operations in the published Postman collection (records + location)
  finding: >-
    CrimeoMeter's own two published sources disagree about the current Sex Offenders
    version. https://www.crimeometer.com/sex-offenders-api still shows a v3 request example
    with only zipcode and name; the public Postman collection published 2024-07-26 shows v5
    with nine query parameters and a second operation (/sex-offenders/location) that the
    product page does not mention at all. Live probes cannot arbitrate — the AWS API Gateway
    edge returns 403 Forbidden for v3, v4, v5, v6 and for paths that plainly do not exist.
    A consumer reading only the product page would build against a stale contract.
