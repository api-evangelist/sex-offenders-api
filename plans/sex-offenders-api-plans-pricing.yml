description: >-
  Plans as CrimeoMeter actually publishes them, read from www.crimeometer.com/pricing and
  www.crimeometer.com/pricing-table on 2026-08-28. THIS FILE REPLACES A SCAFFOLD: the prior
  version of this artifact (method: generated, dated 2026-05-04) carried invented tier names
  (Free / Professional / Enterprise), invented quotas (1,000 and 100,000 requests per month)
  and invented rate limits that CrimeoMeter has never published. Those values are removed.
plan_count: 2
prices_published: false
pricing_note: >-
  CrimeoMeter names two subscription tracks but publishes no price, no included quota and no
  overage rate for either. The "View Plans" control on the pricing page leads to
  www.crimeometer.com/pricing-table, a Wix pricing-plans widget that renders no amount in the
  served HTML; billing is handled through a Stripe customer portal
  (billing.stripe.com/p/login/...) that requires an existing account. A prospective buyer
  cannot learn what this API costs without contacting sales.
